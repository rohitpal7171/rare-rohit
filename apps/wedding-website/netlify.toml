[build]
  base    = "apps/wedding-website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify automatically serves static files from dist/ before checking redirects.
# Only the SPA fallback is needed — audio files are served directly.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# index.html must never be served from cache — browsers must always revalidate it.
# Without this, a cached old HTML referencing stale chunk hashes causes
# "Failed to fetch dynamically imported module" after every new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
